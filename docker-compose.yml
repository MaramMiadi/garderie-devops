services:
  backend:
    image: miadi/garderie-backend:latest
    container_name: garderie-backend
    restart: unless-stopped
    environment:
      - PORT=4000
    ports:
      - "4000:4000"
    networks:
      - garderie-net

  frontend:
    image: miadi/garderie-frontend:latest
    container_name: garderie-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:4000
    ports:
      - "3000:3000"
    networks:
      - garderie-net

networks:
  garderie-net:
    driver: bridge
